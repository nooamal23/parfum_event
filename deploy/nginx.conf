# Configuration Nginx à installer sur l'HÔTE du VPS (pas dans un conteneur Docker).
# Fichier à copier vers /etc/nginx/sites-available/parfum-event puis à lier avec :
#   sudo ln -s /etc/nginx/sites-available/parfum-event /etc/nginx/sites-enabled/
#
# Remplacez mondomaine.tn et api.mondomaine.tn par vos vrais domaines/sous-domaines
# avant de lancer Certbot (voir deploy/DEPLOY.md).

# ---------- Frontend : mondomaine.tn ----------
server {
    listen 80;
    server_name mondomaine.tn www.mondomaine.tn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------- Backend API : api.mondomaine.tn ----------
server {
    listen 80;
    server_name api.mondomaine.tn;

    # Limite la taille des requêtes (le backend limite déjà le JSON à 100kb,
    # ceci évite que Nginx lui-même n'accepte des corps de requête énormes).
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Après avoir lancé Certbot (voir DEPLOY.md), il modifiera automatiquement ce fichier
# pour ajouter les blocs "listen 443 ssl" et les chemins vers les certificats Let's Encrypt,
# ainsi que la redirection HTTP -> HTTPS.
